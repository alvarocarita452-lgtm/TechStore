
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de categorías | TechStore</title>
    <link rel="stylesheet" href="../dist/output.css">
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">

    <header class="bg-slate-950 text-white px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-extrabold">
            Tech<span class="text-cyan-400">Store</span>
        </h1>

        <a href="./dashboard.html"
           class="bg-cyan-500 hover:bg-cyan-600 px-4 py-2 rounded-lg font-semibold">
            Volver al panel
        </a>
    </header>

    <main class="max-w-6xl mx-auto p-6 md:p-10">

        <div class="mb-8">
            <h2 class="text-3xl font-bold">Gestión de categorías</h2>
            <p class="text-slate-500 mt-2">
                Administra las categorías de productos de TechStore.
            </p>
        </div>

        <!-- FORMULARIO -->
        <section class="bg-white rounded-xl shadow p-6 mb-8">

            <h3 id="tituloFormulario" class="text-xl font-bold mb-5">
                Registrar categoría
            </h3>

            <form id="formCategoria" class="grid grid-cols-1 md:grid-cols-2 gap-5">

                <input type="hidden" id="idCategoria">

                <div>
                    <label for="nombre" class="block font-semibold mb-2">
                        Nombre de la categoría
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        maxlength="100"
                        required
                        class="w-full border border-slate-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-500"
                        placeholder="Ejemplo: Accesorios">
                </div>

                <div>
                    <label for="descripcion" class="block font-semibold mb-2">
                        Descripción
                    </label>

                    <input
                        type="text"
                        id="descripcion"
                        maxlength="255"
                        required
                        class="w-full border border-slate-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-cyan-500"
                        placeholder="Descripción de la categoría">
                </div>

                <div class="md:col-span-2 flex flex-wrap gap-3">

                    <button
                        type="submit"
                        id="btnRegistrar"
                        class="bg-cyan-500 hover:bg-cyan-600 text-white px-6 py-3 rounded-lg font-semibold">
                        Registrar categoría
                    </button>

                    <button
                        type="button"
                        id="btnCancelar"
                        class="hidden bg-slate-500 hover:bg-slate-600 text-white px-6 py-3 rounded-lg font-semibold">
                        Cancelar edición
                    </button>

                </div>

            </form>
        </section>

        <!-- TABLA -->
        <section class="bg-white rounded-xl shadow p-6">

            <div class="flex justify-between items-center mb-5">
                <h3 class="text-xl font-bold">Listado de categorías</h3>

                <button
                    id="btnActualizar"
                    class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg">
                    Actualizar
                </button>
            </div>

            <p id="mensajeCategorias" class="text-sm mb-4 text-slate-500"></p>

            <div class="overflow-x-auto">

                <table class="w-full text-left border-collapse">

                    <thead>
                        <tr class="bg-slate-100 text-slate-600">
                            <th class="p-4">ID</th>
                            <th class="p-4">Nombre</th>
                            <th class="p-4">Descripción</th>
                            <th class="p-4">Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tablaCategorias">
                        <tr>
                            <td colspan="4" class="p-4 text-center text-slate-500">
                                Cargando categorías...
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>
        </section>

    </main>

    <script src="./js/categorias.js"></script>

</body>
</html>
