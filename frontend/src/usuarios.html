
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de usuarios | TechStore</title>
    <link rel="stylesheet" href="../dist/output.css">
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">

    <header class="bg-slate-950 text-white px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-extrabold">
            Tech<span class="text-cyan-400">Store</span>
        </h1>

        <a href="./dashboard.html"
           class="bg-cyan-500 hover:bg-cyan-600 px-4 py-2 rounded-lg font-semibold">
            Volver al panel
        </a>
    </header>

    <main class="p-6 md:p-10">

        <div class="mb-8">
            <h2 class="text-3xl font-bold">Gestión de usuarios</h2>
            <p class="text-slate-500 mt-2">
                Administra los usuarios y sus permisos dentro de TechStore.
            </p>
        </div>

        <!-- FORMULARIO -->
        <section class="bg-white rounded-xl shadow p-6 mb-8">

            <h3 id="tituloFormulario" class="text-xl font-bold mb-5">
                Registrar usuario
            </h3>

            <form id="formUsuario">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                    <div>
                        <label for="nombres" class="block font-semibold mb-2">
                            Nombres
                        </label>
                        <input
                            type="text"
                            id="nombres"
                            maxlength="80"
                            required
                            placeholder="Nombres del usuario"
                            class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>

                    <div>
                        <label for="apellidos" class="block font-semibold mb-2">
                            Apellidos
                        </label>
                        <input
                            type="text"
                            id="apellidos"
                            maxlength="80"
                            required
                            placeholder="Apellidos del usuario"
                            class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>

                    <div>
                        <label for="correo" class="block font-semibold mb-2">
                            Correo electrónico
                        </label>
                        <input
                            type="email"
                            id="correo"
                            maxlength="100"
                            required
                            placeholder="usuario@correo.com"
                            class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>

                    <div>
                        <label for="contrasena" class="block font-semibold mb-2">
                            Contraseña
                        </label>
                        <input
                            type="password"
                            id="contrasena"
                            minlength="8"
                            maxlength="255"
                            placeholder="Contraseña del usuario"
                            class="w-full border border-slate-300 rounded-lg px-4 py-3">
                        <p id="ayudaContrasena" class="text-xs text-slate-500 mt-1">
                            La contraseña es obligatoria al registrar un usuario.
                        </p>
                    </div>

                    <div>
                        <label for="rol" class="block font-semibold mb-2">
                            Rol
                        </label>
                        <select
                            id="rol"
                            required
                            class="w-full border border-slate-300 rounded-lg px-4 py-3">

                            <option value="">Seleccionar rol</option>
                            <option value="Administrador">Administrador</option>
                            <option value="Vendedor">Vendedor</option>

                        </select>
                    </div>

                </div>

                <div class="flex gap-3 mt-6">

                    <button
                        type="submit"
                        id="btnGuardar"
                        class="bg-cyan-500 hover:bg-cyan-600 text-white px-6 py-3 rounded-lg font-semibold">
                        Registrar usuario
                    </button>

                    <button
                        type="button"
                        id="btnCancelar"
                        class="hidden bg-slate-500 hover:bg-slate-600 text-white px-6 py-3 rounded-lg font-semibold">
                        Cancelar
                    </button>

                </div>

            </form>

        </section>

        <!-- MENSAJES -->
        <div id="mensajeUsuario"
             class="hidden rounded-lg p-4 mb-6">
        </div>

        <!-- TABLA -->
        <section class="bg-white rounded-xl shadow p-6">

            <h3 class="text-xl font-bold mb-5">
                Listado de usuarios
            </h3>

            <p id="cantidadUsuarios" class="text-sm text-slate-500 mb-4">
                Cargando usuarios...
            </p>

            <div class="overflow-x-auto">

                <table class="w-full text-left">

                    <thead class="bg-slate-100">
                        <tr>
                            <th class="p-3">ID</th>
                            <th class="p-3">Nombres</th>
                            <th class="p-3">Apellidos</th>
                            <th class="p-3">Correo</th>
                            <th class="p-3">Rol</th>
                            <th class="p-3">Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tablaUsuarios">
                        <tr>
                            <td colspan="6" class="p-4 text-center">
                                Cargando información...
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="./js/usuarios.js"></script>

</body>
</html>
