
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | TechStore</title>
    <link rel="stylesheet" href="../dist/output.css">
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center px-4">

    <main class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-slate-900">
                Tech<span class="text-cyan-500">Store</span>
            </h1>

            <p class="text-slate-500 mt-3">
                Inicia sesión en tu cuenta
            </p>
        </div>

        <form id="formLogin" class="space-y-5">

            <div>
                <label for="correo"
                    class="block text-sm font-semibold text-slate-700 mb-2">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    required
                    placeholder="ejemplo@correo.com"
                    class="w-full border border-slate-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-cyan-500">
            </div>

            <div>
                <label for="contrasena"
                    class="block text-sm font-semibold text-slate-700 mb-2">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    required
                    placeholder="Ingresa tu contraseña"
                    class="w-full border border-slate-300 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-cyan-500">
            </div>

            <p id="mensaje" class="text-sm text-center"></p>

            <button
                type="submit"
                id="btnLogin"
                class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-3 rounded-lg transition">
                Iniciar sesión
            </button>

        </form>

        <p class="text-center text-sm text-slate-500 mt-8">
            © 2026 TechStore
        </p>

    </main>

    <script src="./js/login.js"></script>

</body>
</html>
