
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos | TechStore</title>
    <link rel="stylesheet" href="../dist/output.css">
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">

    <!-- ENCABEZADO -->
    <header class="bg-slate-950 px-6 py-5 text-white flex justify-between items-center">
        <h1 class="text-2xl font-extrabold">
            Tech<span class="text-cyan-400">Store</span>
        </h1>

        <a href="./dashboard.html"
           class="bg-cyan-500 hover:bg-cyan-600 px-4 py-2 rounded-lg font-semibold">
            Volver al panel
        </a>
    </header>

    <!-- CONTENIDO -->
    <main class="mx-auto max-w-7xl px-6 py-10">

        <div class="mb-8">
            <h2 class="text-3xl font-bold">Gestión de productos</h2>
            <p class="text-slate-500 mt-2">
                Consulta los productos registrados en TechStore.
            </p>
        </div>

        <!-- MENSAJE -->
        <p id="mensaje" class="mb-4 text-sm font-semibold"></p>

        <!-- FORMULARIO DE PRODUCTOS -->
        <section class="bg-white rounded-xl shadow p-6 mb-8">

            <h3 id="tituloFormulario" class="text-xl font-bold mb-5">
                Registrar producto
            </h3>

            <form id="formProducto" class="grid grid-cols-1 md:grid-cols-2 gap-5">

                <div>
                    <label class="block font-semibold mb-2">Nombre</label>
                    <input
                        type="text"
                        id="nombre"
                        required
                        maxlength="100"
                        placeholder="Ejemplo: Laptop ASUS"
                        class="w-full border border-slate-300 rounded-lg px-4 py-3">
                </div>

                <div>
                    <label class="block font-semibold mb-2">Descripción</label>
                    <input
                        type="text"
                        id="descripcion"
                        placeholder="Descripción del producto"
                        class="w-full border border-slate-300 rounded-lg px-4 py-3">
                </div>

                <div>
                    <label class="block font-semibold mb-2">Precio (S/)</label>
                    <input
                        type="number"
                        id="precio"
                        required
                        min="0"
                        step="0.01"
                        placeholder="2500.00"
                        class="w-full border border-slate-300 rounded-lg px-4 py-3">
                </div>

                <div>
                    <label class="block font-semibold mb-2">Stock</label>
                    <input
                        type="number"
                        id="stock"
                        required
                        min="0"
                        step="1"
                        placeholder="10"
                        class="w-full border border-slate-300 rounded-lg px-4 py-3">
                </div>

                <div>
                    <label class="block font-semibold mb-2">Categoría</label>
                    <select
                        id="idCategoria"
                        required
                        class="w-full border border-slate-300 rounded-lg px-4 py-3">
                        <option value="">Selecciona una categoría</option>
                    </select>
                </div>

                <div class="flex items-end gap-3">
                    <button
                        type="submit"
                        id="btnRegistrar"
                        class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-semibold rounded-lg px-5 py-3">
                        Registrar producto
                    </button>

                    <button
                        type="button"
                        id="btnCancelar"
                        class="hidden w-full bg-slate-500 hover:bg-slate-600 text-white font-semibold rounded-lg px-5 py-3">
                        Cancelar
                    </button>
                </div>

            </form>
        </section>

        <!-- TABLA DE PRODUCTOS -->
        <section class="bg-white rounded-xl shadow overflow-hidden">

            <div class="px-6 py-5 border-b border-slate-200 flex justify-between items-center">
                <h3 class="text-xl font-bold">Listado de productos</h3>

                <button
                    id="btnActualizar"
                    class="bg-cyan-500 hover:bg-cyan-600 text-white px-4 py-2 rounded-lg font-semibold">
                    Actualizar listado
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left">

                    <thead class="bg-slate-100 text-slate-600 text-sm">
                        <tr>
                            <th class="px-6 py-4">ID</th>
                            <th class="px-6 py-4">Producto</th>
                            <th class="px-6 py-4">Descripción</th>
                            <th class="px-6 py-4">Precio</th>
                            <th class="px-6 py-4">Stock</th>
                            <th class="px-6 py-4">Categoría</th>
                            <th class="px-6 py-4 text-center">Estado</th>
                            <th class="px-6 py-4 text-center">Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tablaProductos">
                        <tr>
                            <td colspan="8" class="text-center py-8 text-slate-500">
                                Cargando productos...
                            </td>
                        </tr>
                    </tbody>

                </table>
            </div>

        </section>

    </main>

    <script src="./js/productos.js"></script>

</body>
</html>
